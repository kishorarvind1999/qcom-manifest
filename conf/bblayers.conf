# This configuration file is dynamically generated every time
# set_bb_env.sh is sourced to set up a workspace.  DO NOT EDIT.
#--------------------------------------------------------------
# LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
LCONF_VERSION = "7"
WORKSPACE := "${@os.path.abspath(os.path.dirname(d.getVar('FILE', True)))}/../.."

BBPATH = "${TOPDIR}"

BBFILES = " \
"

# These layers hold recipe metadata not found in OE-core, but lack any machine or distro content
BASELAYERS ?= " \
  ${WORKSPACE}/meta-openembedded/meta-filesystems \
  ${WORKSPACE}/meta-openembedded/meta-gnome \
  ${WORKSPACE}/meta-openembedded/meta-multimedia \
  ${WORKSPACE}/meta-openembedded/meta-networking \
  ${WORKSPACE}/meta-openembedded/meta-oe \
  ${WORKSPACE}/meta-openembedded/meta-perl \
  ${WORKSPACE}/meta-openembedded/meta-python \
  ${WORKSPACE}/meta-updater \
  ${WORKSPACE}/poky/meta \
  ${WORKSPACE}/poky/meta-poky \
  ${WORKSPACE}/meta-security \
  ${WORKSPACE}/meta-security/meta-tpm \
  ${WORKSPACE}/meta-selinux \
  ${WORKSPACE}/meta-virtualization \
  ${WORKSPACE}/meta-tensorflow \
"

# These layers hold machine specific content, aka Board Support Packages
BSPLAYERS ?= " \
  ${WORKSPACE}/meta-qcom-hwe \
  ${WORKSPACE}/meta-qcom \
"

# Add your overlay layers location to EXTRALAYERS
# Make sure to have a conf/layers.conf in there
EXTRALAYERS ?= " \
  ${WORKSPACE}/meta-audio \ 
"

BBLAYERS = " \
  ${WORKSPACE}/meta-qcom-distro \
  ${EXTRALAYERS} \
  ${BASELAYERS} \
  ${BSPLAYERS} \
  /home/kishor/Projects/qcom_image/build/workspace \
  /home/kishor/Projects/qcom_image/meta-qcom-qim-product-sdk \
  "
